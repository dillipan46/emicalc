<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Daily Reducing Loan Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  padding: 10px;
}
.card {
  background: #fff;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 10px;
}
h3 {
  text-align: center;
  margin-bottom: 10px;
}
input, select {
  width: 100%;
  padding: 9px;
  margin-top: 6px;
  font-size: 14px;
}
.radio-group {
  margin-top: 8px;
  font-size: 14px;
}
.radio-group label {
  margin-right: 12px;
}
button {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  font-size: 16px;
  background: #007bff;
  color: white;
  border: none;
  border-radius: 6px;
}
.summary {
  font-size: 14px;
  margin-top: 10px;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  margin-top: 10px;
}
th, td {
  border: 1px solid #ddd;
  padding: 6px;
  text-align: right;
}
th {
  background: #eee;
}
th:first-child, td:first-child {
  text-align: center;
}
</style>
</head>

<body>

<div class="card">
  <h3>Daily Reducing Loan Calculator</h3>

  <input type="number" id="principal" placeholder="Outstanding Amount">
  <input type="number" id="interest" placeholder="Annual Interest Rate (%)" value="7.90">

  <!-- EMI default -->
  <input type="number" id="emi" value="22367" placeholder="Monthly EMI">

  <!-- Monthly Extra Payment -->
  <div class="radio-group">
    <b>Additional Payment per Month</b><br>
    <label><input type="radio" name="extraMonthly" value="0" checked> None</label>
    <label><input type="radio" name="extraMonthly" value="3000"> ₹3,000</label>
    <label><input type="radio" name="extraMonthly" value="5000"> ₹5,000</label>
  </div>

  <!-- Annual Extra Payment -->
  <div class="radio-group">
    <b>Additional Payment per Year</b><br>
    <label><input type="radio" name="extraAnnual" value="0" checked> None</label>
    <label><input type="radio" name="extraAnnual" value="50000"> ₹50,000</label>
    <label><input type="radio" name="extraAnnual" value="100000"> ₹1,00,000</label>
  </div>

  <!-- Annual Month -->
  <select id="annualMonth">
    <option value="0">January</option>
    <option value="1">February</option>
    <option value="2">March</option>
    <option value="3">April</option>
    <option value="4">May</option>
    <option value="5">June</option>
    <option value="6">July</option>
    <option value="7">August</option>
    <option value="8">September</option>
    <option value="9">October</option>
    <option value="10">November</option>
    <option value="11" selected>December</option>
  </select>

  <button onclick="calculate()">Calculate</button>

  <div class="summary" id="summary"></div>
</div>

<div class="card">
  <h3>Month-wise Amortization</h3>
  <div style="overflow-x:auto;">
    <table>
      <thead>
        <tr>
          <th>Month</th>
          <th>Opening</th>
          <th>Interest</th>
          <th>EMI</th>
          <th>Extra</th>
          <th>Closing</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script>
function daysInMonth(y, m) {
  return new Date(y, m + 1, 0).getDate();
}
function daysInYear(y) {
  return ((y % 4 === 0 && y % 100 !== 0) || y % 400 === 0) ? 366 : 365;
}

function simulate(p, r, emi, em, ea, annualMonth, buildTable) {
  let balance = p;
  let totalInterest = 0;
  let rows = [];
  let date = new Date();

  while (balance > 0 && rows.length < 1200) {
    let y = date.getFullYear();
    let m = date.getMonth();
    let dim = daysInMonth(y, m);
    let diy = daysInYear(y);

    let opening = balance;
    let interest = opening * (r / 100) * (dim / diy);
    totalInterest += interest;
    balance += interest;

    let extra = em;
    if (m === annualMonth) extra += ea;

    let payment = Math.min(emi + extra, balance);
    balance -= payment;

    if (buildTable) {
      rows.push({
        month: date.toLocaleString('en-US', { month: 'short', year: 'numeric' }),
        opening, interest, emi, extra, closing: balance
      });
    }

    date.setMonth(date.getMonth() + 1);
  }

  return { rows, totalInterest, endDate: date };
}

function calculate() {
  const p = +principal.value;
  const r = +interest.value;
  const emiVal = +emi.value;

  const em = +document.querySelector('input[name="extraMonthly"]:checked').value;
  const ea = +document.querySelector('input[name="extraAnnual"]:checked').value;
  const am = +annualMonth.value;

  if (p <= 0 || r <= 0 || emiVal <= 0) return;

  const normal = simulate(p, r, emiVal, 0, 0, 0, false);
  const withExtra = simulate(p, r, emiVal, em, ea, am, true);

  const saved = normal.totalInterest - withExtra.totalInterest;

  summary.innerHTML = `
    <b>Loan Ends:</b> ${withExtra.endDate.toLocaleString('en-US',{month:'short',year:'numeric'})}<br>
    <b>Total Interest (Normal):</b> ₹${normal.totalInterest.toFixed(0)}<br>
    <b>Total Interest (With Extra):</b> ₹${withExtra.totalInterest.toFixed(0)}<br>
    <b>Interest Saved:</b> ₹${saved.toFixed(0)}
  `;

  tableBody.innerHTML = "";
  withExtra.rows.forEach(r => {
    tableBody.innerHTML += `
      <tr>
        <td>${r.month}</td>
        <td>${r.opening.toFixed(0)}</td>
        <td>${r.interest.toFixed(0)}</td>
        <td>${emiVal.toFixed(0)}</td>
        <td>${r.extra.toFixed(0)}</td>
        <td>${r.closing.toFixed(0)}</td>
      </tr>`;
  });
}
</script>

</body>
</html>
